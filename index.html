      // ── Supabase config (REST API via fetch, no SDK) ──────────────────────
      const SUPABASE_URL = import.meta.env.VITE_SUPABASE_URL;
      const SUPABASE_KEY = import.meta.env.VITE_SUPABASE_ANON_KEY;
      const sbHeaders = {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
      };

      async function sbSelect(table, query, eqCol, eqVal) {
        const url = `${SUPABASE_URL}/rest/v1/${table}?select=${encodeURIComponent(query)}&${eqCol}=eq.${encodeURIComponent(eqVal)}&order=created_at.desc`;
        const res = await fetch(url, { headers: sbHeaders });
        if (!res.ok) throw new Error('Supabase error');
        return res.json();
      }

      async function sbInsert(table, body, select) {
        const url = `${SUPABASE_URL}/rest/v1/${table}?select=${encodeURIComponent(select)}`;
        const res = await fetch(url, {
          method: 'POST',
          headers: { ...sbHeaders, Prefer: 'return=representation' },
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error('Supabase insert error');
        return res.json();
      }

      async function sbUpdate(table, body, filters) {
        const filterStr = Object.entries(filters).map(([k, v]) => `${k}=eq.${encodeURIComponent(v)}`).join('&');
        const url = `${SUPABASE_URL}/rest/v1/${table}?${filterStr}`;
        const res = await fetch(url, {
          method: 'PATCH',
          headers: { ...sbHeaders, Prefer: 'return=minimal' },
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error('Supabase update error');
      }

      async function sbDelete(table, filters) {
        const filterStr = Object.entries(filters).map(([k, v]) => `${k}=eq.${encodeURIComponent(v)}`).join('&');
        const url = `${SUPABASE_URL}/rest/v1/${table}?${filterStr}`;
        const res = await fetch(url, { method: 'DELETE', headers: sbHeaders });
        if (!res.ok) throw new Error('Supabase delete error');
      }

      // ── Helpers ───────────────────────────────────────────────────────────
      function timeAgo(dateStr) {
        const diff = Date.now() - new Date(dateStr).getTime();
        const mins = Math.floor(diff / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return `${mins}m ago`;
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return `${hrs}h ago`;
        const days = Math.floor(hrs / 24);
        if (days < 30) return `${days}d ago`;
        const months = Math.floor(days / 30);
        if (months < 12) return `${months}mo ago`;
        return `${Math.floor(months / 12)}y ago`;
      }

      function getVoterId() {
        let id = localStorage.getItem('mv_voter_id');
        if (!id) {
          id = crypto.randomUUID();
          localStorage.setItem('mv_voter_id', id);
        }
        return id;
      }

      function starRating(rating) {
        const filled = Math.round((rating / 10) * 5);
        let html = '<div class="gp-stars">';
        for (let i = 0; i < 5; i++) {
          html += `<span class="gp-star ${i < filled ? 'gp-star--filled' : ''}">${i < filled ? '★' : '☆'}</span>`;
        }
        html += '</div>';
        return html;
      }

      function esc(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      // ── App state ─────────────────────────────────────────────────────────
      let view = 'home';
      let pickedGenre = null;
      let selectedMovie = null;

      const root = document.getElementById('root');

      function render() {
        document.body.style.overflow = selectedMovie ? 'hidden' : '';
        if (view === 'home') {
          renderHome();
        } else if (view === 'genre' && pickedGenre) {
          renderGenrePage();
          if (selectedMovie) renderModal();
        }
      }

        root.innerHTML = `

            <div class="genre-hero">
              <h1 class="genre-hero__title">What are you in the mood for?</h1>
              <p class="genre-hero__sub">Pick a genre and we'll surface films you'll love.</p>
            </div>
            <div class="genre-grid">
              ${genres.map(g => `
                <button class="genre-card" data-genre="${esc(g.name)}">
                  <div class="genre-card__image" style="background-image:url(${esc(g.image)})"></div>
                  <div class="genre-card__overlay"></div>
                  <div class="genre-card__content">
                    <h3 class="genre-card__name">${esc(g.name)}</h3>
                    <p class="genre-card__blurb">${esc(g.blurb)}</p>
                  </div>
                  <span class="genre-card__arrow">→</span>
                </button>
              `).join('')}
            </div>
            <footer class="genre-footer">
              <span>© 2026 MovieMatch</span>
              <span>Crafted for film lovers</span>
            </footer>
          </section>
        `;
        root.querySelectorAll('.genre-card').forEach(btn => {
          btn.addEventListener('click', () => {
            pickedGenre = btn.dataset.genre;
            view = 'genre';
            window.scrollTo(0, 0);
            render();
          });
        });
      }

      function renderGenrePage() {
        const filtered = movies.filter(m => m.genres.includes(pickedGenre));
        root.innerHTML = `
          <div class="gp-page">
            <div class="gp-banner">
              <div class="gp-banner__inner">
                <button class="gp-back" id="back-btn">← MovieMatch</button>
              </div>
            </div>
            <div class="gp-body">
              <div class="gp-body__inner">
                <h1 class="gp-title">${esc(pickedGenre)} Movies</h1>
                ${filtered.length === 0
                  ? '<p class="gp-empty">No movies in this genre yet. Check back soon.</p>'
                  : `<div class="gp-grid">
                      ${filtered.map(m => `
                        <button class="gp-card" data-id="${esc(m.id)}">
                          <div class="gp-card__top">
                            <div class="gp-card__poster-wrap">
                              ${m.poster
                                ? `<img src="${esc(m.poster)}" alt="${esc(m.title)}" class="gp-card__poster" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                                   <div class="gp-card__poster-fallback" style="display:none"><span>${esc(m.title.charAt(0))}</span></div>`
                                : `<div class="gp-card__poster-fallback"><span>${esc(m.title.charAt(0))}</span></div>`}
                            </div>
                            ${starRating(m.rating)}
                          </div>
                          <div class="gp-card__body">
                            <p class="gp-card__title">${esc(m.title)}</p>
                            <p class="gp-card__synopsis">${esc(m.synopsis)}</p>
                            <div class="gp-card__meta">
                              <span class="gp-card__year">${m.year}</span>
                              <span class="gp-card__runtime">${esc(m.runtime)}</span>
                              <span class="gp-card__cert">${esc(m.certificate)}</span>
                            </div>
                          </div>
                        </button>
                      `).join('')}
                    </div>`}
              </div>
            </div>
            <footer class="gp-footer">
              <span>© 2026 MovieMatch</span>
              <span>Crafted for film lovers</span>
            </footer>
          </div>
        `;
        document.getElementById('back-btn').addEventListener('click', () => {
          view = 'home';
          pickedGenre = null;
          window.scrollTo(0, 0);
          render();
        });
        root.querySelectorAll('.gp-card').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedMovie = movies.find(m => m.id === btn.dataset.id);
            render();
          });
        });
      }

      function renderModal() {
        const movie = selectedMovie;
        const overlay = document.createElement('div');
        overlay.className = 'modal';
        overlay.innerHTML = `
          <div class="modal__panel">
            <button class="modal__close" aria-label="Close">✕</button>
            <div class="modal__backdrop" style="background-image:url(${esc(movie.backdrop)})">
              <div class="modal__backdrop-overlay"></div>
            </div>
            <div class="modal__content">
              <div class="modal__head">
                <img class="modal__poster" src="${esc(movie.poster)}" alt="${esc(movie.title)} poster" />
                <div class="modal__head-info">
                  <div class="modal__badges">
                    <span class="modal__status">${esc(movie.status)}</span>
                    <span class="modal__cert">${esc(movie.certificate)}</span>
                  </div>
                  <h2 class="modal__title">${esc(movie.title)}</h2>
                  <div class="modal__stats">
                    <span class="modal__rating">★ ${movie.rating}/10</span>
                    <span>${movie.year}</span>
                    <span>${esc(movie.runtime)}</span>
                    <span>${esc(movie.releaseDate)}</span>
                  </div>
                  <p class="modal__tagline">"${esc(movie.tagline)}"</p>
                  <div class="modal__genres">
                    ${movie.genres.map(g => `<span class="modal__genre">${esc(g)}</span>`).join('')}
                  </div>
                  <div class="modal__actions">
                    <button class="btn btn--ghost">+ Watchlist</button>
                  </div>
                  <div class="reactions">
                    <button class="reaction" id="like-btn" disabled>
                      <span class="reaction__icon">👍</span>
                      <span class="reaction__label">Like</span>
                      <span class="reaction__count" id="like-count">0</span>
                    </button>
                    <button class="reaction reaction--dislike" id="dislike-btn" disabled>
                      <span class="reaction__icon">👎</span>
                      <span class="reaction__label">Dislike</span>
                      <span class="reaction__count" id="dislike-count">0</span>
                    </button>
                  </div>
                </div>
              </div>
              <div class="modal__body">
                <div class="modal__section">
                  <h3>Synopsis</h3>
                  <p>${esc(movie.synopsis)}</p>
                </div>
                <div class="modal__grid">
                  <div class="modal__section">
                    <h3>Director</h3>
                    <p>${esc(movie.director)}</p>
                  </div>
                  <div class="modal__section">
                    <h3>Starring</h3>
                    <ul class="modal__cast">
                      ${movie.cast.map(c => `<li>${esc(c)}</li>`).join('')}
                    </ul>
                  </div>
                </div>
                <div class="modal__section comments">
                  <h3>Comments <span class="comments__count" id="comments-count" style="display:none">0</span></h3>
                  <form class="comments__form" id="comment-form">
                    <input class="comments__input" type="text" placeholder="Your name" maxlength="50" id="author-input" />
                    <textarea class="comments__textarea" placeholder="Share your thoughts about this movie..." maxlength="500" rows="3" id="content-input"></textarea>
                    <p class="comments__error" id="comment-error" style="display:none"></p>
                    <button class="btn btn--ghost comments__submit" type="submit" id="submit-btn" disabled>Post Comment</button>
                  </form>
                  <div class="comments__list" id="comments-list">
                    <p class="comments__empty">Loading comments...</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
        root.appendChild(overlay);

        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) closeModal();
        });
        overlay.querySelector('.modal__close').addEventListener('click', closeModal);
        const escHandler = (e) => { if (e.key === 'Escape') closeModal(); };
        window.addEventListener('keydown', escHandler);

        function closeModal() {
          overlay.remove();
          window.removeEventListener('keydown', escHandler);
          selectedMovie = null;
          document.body.style.overflow = '';
        }

        // ── Comments ──────────────────────────────────────────────────────
        const authorInput = overlay.querySelector('#author-input');
        const contentInput = overlay.querySelector('#content-input');
        const submitBtn = overlay.querySelector('#submit-btn');
        const commentError = overlay.querySelector('#comment-error');
        const commentsList = overlay.querySelector('#comments-list');
        const commentsCount = overlay.querySelector('#comments-count');

        function updateSubmitState() {
          submitBtn.disabled = !authorInput.value.trim() || !contentInput.value.trim();
        }
        authorInput.addEventListener('input', updateSubmitState);
        contentInput.addEventListener('input', updateSubmitState);

        function renderComments(comments) {
          commentsCount.textContent = comments.length;
          commentsCount.style.display = comments.length > 0 ? 'inline-flex' : 'none';
          if (comments.length === 0) {
            commentsList.innerHTML = '<p class="comments__empty">No comments yet. Be the first to share your thoughts!</p>';
            return;
          }
          commentsList.innerHTML = comments.map(c => `
            <div class="comment">
              <div class="comment__avatar">${esc(c.author.charAt(0).toUpperCase())}</div>
              <div class="comment__body">
                <div class="comment__header">
                  <span class="comment__author">${esc(c.author)}</span>
                  <span class="comment__time">${timeAgo(c.created_at)}</span>
                </div>
                <p class="comment__text">${esc(c.content)}</p>
              </div>
            </div>
          `).join('');
        }

        // Load comments
        sbSelect('movie_comments', 'id,author,content,created_at', 'movie_id', movie.id)
          .then(data => renderComments(data || []))
          .catch(() => {
            commentsList.innerHTML = '<p class="comments__empty">Could not load comments.</p>';
          });

        // Submit comment
        overlay.querySelector('#comment-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const author = authorInput.value.trim();
          const content = contentInput.value.trim();
          if (!author || !content) return;
          submitBtn.textContent = 'Posting...';
          submitBtn.disabled = true;
          commentError.style.display = 'none';
          try {
            const [inserted] = await sbInsert('movie_comments', { movie_id: movie.id, author, content }, 'id,author,content,created_at');
            const existing = Array.from(commentsList.querySelectorAll('.comment')).map(el => ({
              id: el.dataset.id,
              author: el.querySelector('.comment__author')?.textContent || '',
              content: el.querySelector('.comment__text')?.textContent || '',
              created_at: '',
            }));
            renderComments([inserted, ...existing.filter(c => c.id)]);
            contentInput.value = '';
          } catch {
            commentError.textContent = 'Could not post your comment. Please try again.';
            commentError.style.display = 'block';
          }
          submitBtn.textContent = 'Post Comment';
          updateSubmitState();
        });

        // ── Reactions ─────────────────────────────────────────────────────
        const likeBtn = overlay.querySelector('#like-btn');
        const dislikeBtn = overlay.querySelector('#dislike-btn');
        const likeCount = overlay.querySelector('#like-count');
        const dislikeCount = overlay.querySelector('#dislike-count');
        let likes = 0, dislikes = 0, userReaction = null, reacting = false;

        function updateReactionUI() {
          likeCount.textContent = likes;
          dislikeCount.textContent = dislikes;
          likeBtn.classList.toggle('reaction--active', userReaction === 'like');
          dislikeBtn.classList.toggle('reaction--active', userReaction === 'dislike');
          likeBtn.disabled = reacting;
          dislikeBtn.disabled = reacting;
        }

        const voterId = getVoterId();
        sbSelect('movie_reactions', 'reaction,voter_id', 'movie_id', movie.id)
          .then(data => {
            if (!data) return;
            const all = data;
            likes = all.filter(r => r.reaction === 'like').length;
            dislikes = all.filter(r => r.reaction === 'dislike').length;
            const mine = all.find(r => r.voter_id === voterId);
            userReaction = mine ? mine.reaction : null;
            updateReactionUI();
          })
          .catch(() => updateReactionUI());

        async function handleReaction(type) {
          if (reacting) return;
          reacting = true;
          updateReactionUI();
          try {
            if (userReaction === type) {
              await sbDelete('movie_reactions', { movie_id: movie.id, voter_id: voterId });
              userReaction = null;
              if (type === 'like') likes--; else dislikes--;
            } else if (userReaction) {
              await sbUpdate('movie_reactions', { reaction: type }, { movie_id: movie.id, voter_id: voterId });
              userReaction = type;
              if (type === 'like') { likes++; dislikes--; } else { dislikes++; likes--; }
            } else {
              await sbInsert('movie_reactions', { movie_id: movie.id, reaction: type, voter_id: voterId }, 'reaction,voter_id');
              userReaction = type;
              if (type === 'like') likes++; else dislikes++;
            }
          } catch { /* ignore */ }
          reacting = false;
          updateReactionUI();
        }

        likeBtn.addEventListener('click', () => handleReaction('like'));
        dislikeBtn.addEventListener('click', () => handleReaction('dislike'));
      }

      // ── Init ──────────────────────────────────────────────────────────────
      render();
    </script>
  </body>
</html>
